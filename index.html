<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hari Ganesh J — AI/ML Engineer & Dual-Degree CS Student</title>
  <meta name="description" content="Portfolio of Hari Ganesh J — AI/ML engineer and dual-degree student at VIT Chennai and IIT Madras.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1a'/%3E%3Ctext x='16' y='23' font-family='Impact,sans-serif' font-size='20' text-anchor='middle' fill='%23f0ede8'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display&family=Inter:wght@300..900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Preloader -->
  <div id="loader" aria-hidden="true">
    <div class="loader-pill"><span class="loader-bar"></span></div>
    <div class="loader-name" id="loader-name"></div>
  </div>

  <!-- Film grain overlay -->
  <div class="grain" aria-hidden="true"></div>

  <!-- Floating pill navigation -->
  <nav id="navbar" aria-label="Main">
    <div class="nav-brand" id="nav-brand"></div>
    <div class="nav-links">
      <a href="#hero-section">Home<i></i></a>
      <a href="#about">About<i></i></a>
      <a href="#tech-stack">Tech Stack<i></i></a>
      <a href="#projects">Projects<i></i></a>
    </div>
    <div class="nav-right">
      <button id="sound-toggle" type="button" title="Mute UI sounds" aria-label="Toggle sound" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path class="wave" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
      <a href="#contact" class="nav-cta">Contact</a>
    </div>
  </nav>

  <main>
    <!-- ============ HERO (500vh scroll sequence) ============ -->
    <div id="hero-section">
      <div class="hero-stage">
        <canvas id="dust"></canvas>

        <div class="ghost" id="ghost"><span id="ghost-word"></span></div>

        <canvas id="burst"></canvas>

        <div class="hero-center" id="hero-center">
          <h1 id="hero-name" aria-label=""></h1>
          <h2 id="hero-sub"></h2>
        </div>

        <div class="slide-dashes" id="slide-dashes"></div>

        <div class="hero-intro" id="hero-intro">
          <div class="intro-hello" id="intro-eyebrow"></div>
          <h2 id="intro-name"></h2>
          <div class="intro-type" aria-label="Role"><span id="intro-type-text"></span><span class="type-cursor" aria-hidden="true">|</span></div>
          <div class="intro-actions">
            <a class="intro-btn" href="#about"><span id="intro-btn-label"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16m0 0l-6-6m6 6l6-6"/></svg>
            </a>
            <div class="intro-links" id="intro-links"></div>
          </div>
        </div>
        <div class="scroll-hint" id="scroll-hint"></div>
      </div>
    </div>

    <!-- ============ ABOUT / TIMELINE ============ -->
    <section id="about">
      <div class="sec-head">
        <div class="eyebrow" id="about-eyebrow"></div>
        <h2 class="sec-title" id="about-title"></h2>
        <div class="stats" id="stats"></div>
        <div class="tabs" id="tabs" role="tablist">
          <button type="button" class="tab is-active" data-filter="all" role="tab">All Milestones</button>
          <button type="button" class="tab" data-filter="core" role="tab">Core Story</button>
          <button type="button" class="tab" data-filter="edu" role="tab">Education &amp; Work</button>
        </div>
      </div>
      <div class="timeline" id="timeline">
        <svg class="tl-path" id="tl-svg" aria-hidden="true">
          <defs>
            <linearGradient id="tl-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1000">
              <stop offset="0" stop-color="#58a6ff"/>
              <stop offset=".55" stop-color="#8b7bff"/>
              <stop offset="1" stop-color="#3fb950"/>
            </linearGradient>
            <filter id="tl-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
          </defs>
          <path id="tl-base" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="2"/>
          <path id="tl-glow" fill="none" stroke="url(#tl-grad)" stroke-width="7" filter="url(#tl-blur)" opacity=".55" pathLength="1"/>
          <path id="tl-line" fill="none" stroke="url(#tl-grad)" stroke-width="2.5" stroke-linecap="round" pathLength="1"/>
          <g id="tl-nodes"></g>
          <circle id="tl-head" r="6" fill="#fff" opacity="0"/>
        </svg>
        <div id="tl-items"></div>
      </div>
    </section>

    <!-- ============ TECH STACK (5-stage pipeline) ============ -->
    <section id="tech-stack">
      <div class="tech-stage">
        <canvas id="aurora"></canvas>
        <canvas id="tunnel"></canvas>
        <div class="tech-vignette"></div>
        <div class="tech-head">
          <div class="eyebrow" id="tech-eyebrow"></div>
          <h2 class="sec-title" id="tech-title"></h2>
        </div>
        <div class="pipeline" id="pipeline"></div>
        <p class="tech-desc" id="tech-desc"></p>
        <div class="tech-foot"><span class="mono" id="tech-stage-name">Scroll ↓</span><span class="mono" id="tech-count">01 / 05</span></div>
      </div>
    </section>

    <!-- ============ CERTIFICATES ============ -->
    <section id="certificates">
      <div class="sec-head">
        <div class="eyebrow" id="cert-eyebrow"></div>
        <h2 class="sec-title" id="cert-title"></h2>
        <p class="sec-blurb" id="cert-blurb"></p>
      </div>
      <div class="marquee"><div class="marquee-track" id="cert-row-1"></div></div>
      <div class="marquee"><div class="marquee-track reverse" id="cert-row-2"></div></div>
      <div class="cert-cta"><a id="cert-profile" class="pill-outline" href="#" target="_blank" rel="noopener"></a></div>
    </section>

    <!-- ============ PROJECTS (pinned horizontal scroll) ============ -->
    <section id="projects">
      <div class="proj-head eyebrow" id="proj-eyebrow"></div>
      <div class="proj-track" id="proj-track"></div>
      <div class="proj-progress"><span id="proj-bar"></span></div>
    </section>

    <!-- ============ CONTACT ============ -->
    <section id="contact">
      <div class="contact-grid">
        <div class="contact-left">
          <div class="eyebrow" id="contact-eyebrow"></div>
          <h2 class="contact-title" id="contact-title"></h2>
          <p class="contact-blurb" id="contact-blurb"></p>
          <div class="direct">
            <span class="label">Direct contact</span>
            <div class="direct-row">
              <a id="contact-email" href="#"></a>
              <button type="button" id="copy-email" class="copy-btn">Copy Email</button>
            </div>
            <ul class="direct-meta">
              <li><span>Phone / WhatsApp</span><a id="contact-phone" href="#"></a></li>
              <li><span>Location</span><b id="contact-location"></b></li>
            </ul>
          </div>
        </div>
        <form class="contact-card" id="contact-form" novalidate>
          <label>Name<input type="text" name="name" placeholder="Your name" autocomplete="name" required></label>
          <label>Email<input type="email" name="email" placeholder="john@example.com" autocomplete="email" required></label>
          <label>Message<textarea name="message" rows="5" placeholder="Tell me about your project..." required></textarea></label>
          <button type="submit" class="send-btn">Send message</button>
          <p class="form-note" id="form-note" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer id="footer">
    <div class="foot-top">
      <div class="foot-brand">
        <div class="foot-brand-top">
          <div class="logo-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 6 3 12 8 18"/><polyline points="16 6 21 12 16 18"/></svg>
          </div>
          <a class="resume-btn" id="resume-btn" href="#" download>Download Resume
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
          </a>
        </div>
        <h3 id="foot-name"></h3>
        <p id="foot-blurb"></p>
        <div class="legal">
          <span id="legal-1"></span>
          <span id="legal-2"></span>
        </div>
      </div>
      <div class="foot-cols">
        <div><h4>Menu</h4><ul id="foot-menu"></ul></div>
        <div><h4>Socials</h4><ul id="foot-socials"></ul></div>
        <div><h4>Featured Projects</h4><ul id="foot-projects"></ul></div>
      </div>
    </div>
    <div class="foot-giant" aria-hidden="true">
      <div class="foot-landscape"></div>
      <div class="foot-word" id="foot-word"></div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
